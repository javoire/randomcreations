<div class="video-wrapper">
  <iframe
    src="https://www.youtube-nocookie.com/embed/{{ .Get "id" }}"
    title="{{ .Get "alt" | default "YouTube video" }}"
    loading="lazy"
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen
  ></iframe>
</div>
