{{ $src := .Get "src" }}
<div class="img-wrapper">
  {{ if eq (.Get "make-link") "true" }}
    <a class="image-link" href="{{ $src }}" target="_blank" rel="noopener noreferrer">
  {{ end }}
  <img src="{{ $src }}" alt="{{ .Get "alt" }}" />
  {{ if eq (.Get "make-link") "true" }}
    </a>
  {{ end }}
</div>
